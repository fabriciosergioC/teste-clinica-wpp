<style id="cvd-base">
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #12232b;
    background: #f4f7f6;
    line-height: 1.55;
  }
  img { max-width: 100%; }
  a { color: #027a4a; }

  .fa-hero {
    background: linear-gradient(135deg, #0b5d46 0%, #12876a 55%, #17a67f 100%);
    color: #fff;
    padding: 72px 24px 88px;
  }
  .fa-container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .fa-hero h1 { font-size: clamp(28px, 5vw, 46px); margin: 0 0 14px; line-height: 1.15; }
  .fa-hero p { font-size: clamp(16px, 2.4vw, 20px); max-width: 620px; margin: 0 0 26px; opacity: .94; }
  .fa-tag {
    display: inline-block; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; letter-spacing: .04em;
    text-transform: uppercase; margin-bottom: 20px;
  }
  .fa-botoes { display: flex; gap: 12px; flex-wrap: wrap; }
  .fa-botoes a {
    text-decoration: none; padding: 13px 22px; border-radius: 10px; font-weight: 600; font-size: 15px;
  }
  .fa-botoes .primario { background: #fff; color: #0b5d46; }
  .fa-botoes .secundario { border: 1.5px solid rgba(255,255,255,.75); color: #fff; }

  .fa-bloco { padding: 56px 0; }
  .fa-bloco h2 { font-size: clamp(22px, 3.6vw, 30px); margin: 0 0 8px; }
  .fa-sub { color: #4a6270; margin: 0 0 30px; max-width: 640px; }
  .fa-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .fa-card {
    background: #fff; border: 1px solid #e2e9e7; border-radius: 14px; padding: 22px;
    box-shadow: 0 1px 2px rgba(16,44,36,.05);
  }
  .fa-card .icone { font-size: 26px; }
  .fa-card h3 { margin: 10px 0 6px; font-size: 17px; }
  .fa-card p { margin: 0; font-size: 14.5px; color: #4a6270; }
  .fa-card .preco { display: block; margin-top: 12px; font-weight: 700; color: #0b5d46; font-size: 15px; }

  .fa-tabela { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden;
               border: 1px solid #e2e9e7; font-size: 15px; }
  .fa-tabela th, .fa-tabela td { padding: 13px 16px; text-align: left; border-bottom: 1px solid #eef3f1; }
  .fa-tabela th { background: #0b5d46; color: #fff; font-weight: 600; font-size: 13.5px; letter-spacing: .02em; }
  .fa-tabela tr:last-child td { border-bottom: 0; }
  .fa-tabela td.valor { white-space: nowrap; font-weight: 700; color: #0b5d46; }
  .fa-scroll { overflow-x: auto; }

  .fa-rodape { background: #0d2b24; color: #b9ccc6; padding: 34px 0; font-size: 14px; }
  .fa-rodape strong { color: #fff; }
  .aviso-demo {
    background: #fff8e6; border: 1px solid #f0dca6; color: #6b5320;
    padding: 12px 16px; border-radius: 10px; font-size: 13.5px; margin: 0 0 26px;
  }
</style>
<style id="cvd-launcher">
  .cvd-balao {
    position: fixed; right: 22px; bottom: 22px; z-index: 9999;
    display: flex; align-items: center; gap: 10px;
    background: #25D366; color: #fff; text-decoration: none;
    padding: 15px 20px; border-radius: 999px; font-weight: 700; font-size: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28); transition: transform .18s ease;
  }
  .cvd-balao:hover { transform: scale(1.04); }
  .cvd-balao svg { width: 24px; height: 24px; fill: #fff; flex: none; }
  .cvd-balao .rotulo-curto { display: none; }
  @media (max-width: 600px) {
    .cvd-balao { right: 14px; bottom: 14px; padding: 14px 16px; }
    .cvd-balao .rotulo-longo { display: none; }
    .cvd-balao .rotulo-curto { display: inline; }
  }
</style>
