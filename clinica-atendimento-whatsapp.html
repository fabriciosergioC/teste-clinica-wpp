<!--
===============================================================================
 PÁGINA 2/2 — SIMULADOR DE ATENDIMENTO (esta)
 O chat abre sozinho e fica no centro da tela. O botão X do cabeçalho verde
 volta para o site (index.html).

 TUDO QUE PRECISA MUDAR está no bloco CONFIG dentro de <script id="cvd-widget">:
   1. CONFIG.clinica.nome, atendente, endereco, horario
   2. CONFIG.clinica.numeroWhatsApp -> formato 55XXXXXXXXXXX
   3. CONFIG.categorias -> exames e PREÇOS (são valores de EXEMPLO)
   4. CONFIG.duvidas -> perguntas e respostas do seu atendimento

 QUER COMO WIDGET NO LUGAR DE PÁGINA? Copie o bloco marcado por
 "INICIO DO WIDGET" / "FIM DO WIDGET" para antes do </body> do seu site. O CSS
 do chat vive num Shadow DOM e não briga com o CSS da página. Sem o atributo
 data-modo="pagina" no <body>, ele volta a ser o balão no canto que abre o chat.
===============================================================================
-->

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(140deg, #0b5d46 0%, #12876a 48%, #17a67f 100%) fixed;
    color: #eaf3ef;
  }
  .cvd-marca {
    position: fixed; top: 20px; left: 0; right: 0; text-align: center;
    font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.8); font-weight: 600; pointer-events: none;
  }
  @media (max-width: 900px) { .cvd-marca { display: none; } }
</style>
</head>

  var svgCheck = '<svg viewBox="0 0 16 15" class="selo" aria-hidden="true"><path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.484.419.335a.62.62 0 0 0 .9-.066l5.855-7.04a.37.37 0 0 0-.08-.516z"/><path d="M12.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L5.666 9.879a.32.32 0 0 1-.484.033l-1.78-1.61a.32.32 0 0 0-.483.03l-.484.58a.32.32 0 0 0 .025.46l2.617 2.37a.32.32 0 0 0 .45-.014l6.89-7.76a.37.37 0 0 0-.08-.52z"/></svg>';
  var svgSend = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.101 21.757L23.8 12.001 1.101 2.245l.011 7.912 13.623 1.844-13.623 1.844-.011 7.912z"/></svg>';
  var svgMinim = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"/></svg>';

  var raiz = document.createElement('div');
  raiz.className = 'cv';

  document.body.appendChild(raiz);
  var sh = raiz.attachShadow({ mode: 'open' });

  sh.innerHTML =
    '<style>' + estilo + '</style>' +

      '<span class="pulso"></span>' + svgWhats + '<span class="novo" id="novo">1</span>' +

  var $ = function (id) { return sh.getElementById(id); };
  var painel = $('painel'), conversa = $('conversa'), campo = $('campo'),
      abrir = $('abrir'), fechar = $('fechar'), dica = $('dica'), reiniciar = $('reiniciar'),
      enviar = $('enviar'), novo = $('novo');

  $('tituloClinica').textContent = CONFIG.clinica.nome;

  var estado = {
    nome: null,
    etapa: 'saudacao',      // saudacao | esperando_nome | menu | categoria | item | duvida | atendente | final
    categoriaAtual: null,
    escolha: null,           // { nome, valor, categoria }
    duvidas: [],             // perguntas já abertas
    periodo: null
  };

  function horaAgora() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function moeda(v) {
    if (v === 0) return 'Grátis';
    return 'R$ ' + String(v).replace('.', ',');
  }
  function preencher(txt) {
    return txt.replace(/\{clinica\}/g, CONFIG.clinica.nome)
              .replace(/\{nome\}/g, estado.nome || 'você')
              .replace(/\{atendente\}/g, CONFIG.clinica.atendente);
  }
  function rolar() { conversa.scrollTop = conversa.scrollHeight; }

  function seloHora(texto) {
    var s = document.createElement('span');
    s.className = 'rodape-bolha';
    s.innerHTML = '<span>' + texto + '</span>';
    return s;
  }

  /* Bolha simples. tipo = 'bot' | 'eu' */
  function bolha(tipo, texto, opcional) {
    var linha = document.createElement('div');
    linha.className = 'linha ' + tipo;
    var b = document.createElement('div');
    b.className = 'bolha';
    b.textContent = texto;
    var rod = seloHora((opcional && opcional.hora) || horaAgora());
    if (tipo === 'eu') {
      var selo = document.createElement('span');
      selo.innerHTML = svgCheck;
      rod.appendChild(selo.firstElementChild);
    }
    b.appendChild(rod);
    linha.appendChild(b);
    conversa.appendChild(linha);
    rolar();
    return { linha: linha, corpo: b, selo: rod.querySelector('.selo') };
  }

  /* Container do bot que recebe blocos ricos (menu, cartão, lista) */
  function blocoBot() {
    var linha = document.createElement('div');
    linha.className = 'linha bot';
    var b = document.createElement('div');
    b.className = 'bolha';
    b.style.background = 'transparent';
    b.style.boxShadow = 'none';
    b.style.padding = '0';
    b.style.maxWidth = '100%';
    linha.appendChild(b);
    conversa.appendChild(linha);
    rolar();
    return b;
  }

  function escrever(indicador) {
    var b = blocoBot();
    var bub = document.createElement('div');
    bub.className = 'escrevendo';
    bub.innerHTML = '<b></b><b></b><b></b>';
    b.appendChild(bub);
    rolar();
    return new Promise(function (resolver) {
      setTimeout(function () { bub.remove(); resolver(b); }, indicador || 750);
    });
  }

  function fala(texto, atraso) {
    return escrever(atraso || 700 + Math.min(texto.length * 4, 900)).then(function (b) {
      var linha = document.createElement('div');
      linha.className = 'bolha';
      linha.style.maxWidth = '79%';
      linha.textContent = texto;
      linha.appendChild(seloHora(horaAgora()));
      b.appendChild(linha);
      rolar();
      return linha;
    });
  }

  function botoes(opcoes) {
    var alvo = blocoBot();
    var m = document.createElement('div');
    m.className = 'menu';
    opcoes.forEach(function (op) {
      var btn = document.createElement('button');
      btn.className = 'opcao' + (op.classe ? ' ' + op.classe : '');
      btn.textContent = op.rotulo;
      btn.onclick = function () {
        m.remove();
        if (op.mensagemEu !== false) bolha('eu', op.rotulo.replace(/^\p{So}\s?/u, '').replace(/^\p{So}\s?/u, ''));
        op.acao();
      };
      m.appendChild(btn);
    });
    alvo.appendChild(m);
    rolar();
    return m;
  }

  /* Lista de itens com preço. Cada linha é clicável. */
  function listaCartao(titulo, subtitulo, itens, aoClicar) {
    var alvo = blocoBot();
    var c = document.createElement('div');
    c.className = 'cartao';
    var topo = document.createElement('div');
    topo.className = 'cartao-topo';
    topo.innerHTML = '<span>' + titulo + '</span>' + (subtitulo ? '<small>' + subtitulo + '</small>' : '');
    c.appendChild(topo);
    var corpo = document.createElement('div');
    corpo.className = 'lista-itens';
    itens.forEach(function (it) {
      var l = document.createElement('div');
      l.className = 'item-linha';
      var esq = document.createElement('div');
      esq.innerHTML = '<div class="item-nome"></div>' + (it.prazo ? '<div class="item-sub">' + it.prazo + '</div>' : '');
      esq.querySelector('.item-nome').textContent = it.nome;
      var preco = document.createElement('div');
      preco.className = 'item-preco' + (it.valor === 0 ? ' gratis' : '');
      preco.textContent = moeda(it.valor);
      l.appendChild(esq); l.appendChild(preco);
      l.onclick = function () {
        corpo.remove(); topo.remove();
        if (!alvo.childNodes.length) alvo.remove();
        bolha('eu', it.nome + ' — ' + moeda(it.valor));
        aoClicar(it);
      };
      corpo.appendChild(l);
    });
    c.appendChild(corpo);
    alvo.appendChild(c);
    rolar();
    return c;
  }

  function dataSeparador(txt) {
    var d = document.createElement('div');
    d.className = 'data';
    d.innerHTML = '<span>' + txt + '</span>';
    conversa.appendChild(d);
  }

  /* ─────────────── LINK REAL DO WHATSAPP ─────────────── */
  function mensagemResumo() {
    var partes = ['Olá, ' + CONFIG.clinica.atendente + '! Vim pelo atendimento digital da ' + CONFIG.clinica.nome + '.'];
    partes.push('Meu nome é ' + estado.nome + '.');
    if (estado.escolha) {
      partes.push('Tenho interesse no exame: ' + estado.escolha.nome + ' (' + moeda(estado.escolha.valor) + ')');
      if (estado.periodo) partes.push('Melhor horário: ' + estado.periodo + '.');
    }
    if (estado.duvidas.length) partes.push('Dúvidas que tive na simulação: ' + estado.duvidas.join(' | '));
    partes.push('Podemos combinar o agendamento?');
    return partes.join('\n\n');
  }
  function linkWhatsApp() {
    return 'https://wa.me/' + CONFIG.clinica.numeroWhatsApp + '?text=' + encodeURIComponent(mensagemResumo());
  }

  function cartaoTransferencia() {
    var alvo = blocoBot();
    var t = document.createElement('div');
    t.className = 'transferir';
    t.innerHTML =
      '<div class="transf-topo">' +
        '<div class="transf-foto">👩‍⚕️</div>' +
        '<div><b>' + CONFIG.clinica.atendente + ' • Atendente</b><span>● online — responde em ' + CONFIG.clinica.prazoRespostaHumana + '</span></div>' +
      '</div>' +

        (estado.periodo ? 'Período preferido: <b>' + estado.periodo + '</b><br>' : '') +
        (estado.duvidas.length ? 'Dúvidas: <b>' + estado.duvidas.length + '</b><br>' : '') +
      '</div>';
    var btn = document.createElement('a');
    btn.className = 'abrir-wa';

    btn.innerHTML = svgWhats + '<span>Abrir WhatsApp com a atendente</span>';
    btn.onclick = function (ev) {
      ev.preventDefault();
      btn.href = linkWhatsApp();
      window.open(btn.href, '_blank', 'noopener');
      bolha('eu', 'Toquei no botão e fui para o WhatsApp real');
      estado.etapa = 'final';
      setTimeout(function () {
        fala('Perfeito, {nome}! 🎉 A ' + CONFIG.clinica.atendente + ' já recebeu o seu resumo aqui do lado. É só apertar enviar na conversa que abriu. Qualquer coisa é só voltar aqui.', 800);
      }, 400);
    };
    t.appendChild(btn);
    var aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.innerHTML = 'Este é um fluxo automatizado de demonstração.<br>O número real aparece só quando você toca acima.';
    t.appendChild(aviso);
    alvo.appendChild(t);
    rolar();
    return t;
  }

  /* ─────────────── FLUXO ─────────────── */
  function fluxoBoasVindas() {
    conversa.innerHTML = '';
    dataSeparador('HOJE');
    estado.etapa = 'esperando_nome';
    campo.placeholder = 'Digite seu nome…';
    fala(preencher(CONFIG.textos.saudacao) + ' Eu sou o assistente virtual e já te mostro os exames, os valores e o prazo de cada laudo.', 500)
      .then(function () { return fala(CONFIG.textos.puxaConversa, 600); })
      .then(function () { campo.focus(); });
  }

  function fluxoMenu() {
    estado.etapa = 'menu';
    estado.categoriaAtual = null;
    var txt = estado.nome
      ? 'Certo, ' + estado.nome + '! O que você procura hoje?'
      : 'O que você procura hoje?';
    fala(txt, 650).then(function () {
      botoes(
        CONFIG.categorias.map(function (c) {
          return { rotulo: c.icone + ' ' + c.rotulo, acao: function () { fluxoCategoria(c.id); } };
        }).concat([
          { rotulo: '❓ Dúvidas frequentes', acao: fluxoDuvidas },
          { rotulo: '💬 Falar com a atendente', classe: 'atendente', acao: fluxoAtendente }
        ])
      );
    });
  }

  function fluxoCategoria(id) {
    var cat = CONFIG.categorias.filter(function (c) { return c.id === id; })[0];
    if (!cat) return;
    estado.etapa = 'categoria';
    estado.categoriaAtual = cat;
    fala(cat.icone + ' ' + cat.rotulo + ' — ' + cat.resumo + '\nToque em um exame para ver o preparo e conversar sobre o agendamento.', 750)
      .then(function () {
        listaCartao(cat.rotulo, cat.itens.length + ' opções', cat.itens, fluxoItem);
        botoes([
          { rotulo: '❓ Dúvidas frequentes', acao: fluxoDuvidas },
          { rotulo: '🏠 Outro tipo de exame', acao: fluxoMenu },
          { rotulo: '💬 Falar com a atendente', classe: 'atendente', acao: fluxoAtendente }
        ]);
      });
  }

  function fluxoItem(it) {
    estado.etapa = 'item';
    estado.escolha = {
      nome: it.nome, valor: it.valor,
      categoria: estado.categoriaAtual ? estado.categoriaAtual.rotulo : '-'
    };
    var texto = it.nome + '\n\n💰 Valor: ' + moeda(it.valor) +
      (it.prazo ? '\n⏱️ Resultado: ' + it.prazo : '') +
      (it.obs ? '\n📌 ' + it.obs : '');
    fala(texto, 900).then(function () {
      fala('Quer seguir com esse exame?', 600).then(function () {
        botoes([
          { rotulo: '✅ Agendar / falar com a atendente', classe: 'atendente', acao: fluxoAtendente },
          { rotulo: '➕ Ver outro exame', acao: function () { if (estado.categoriaAtual) fluxoCategoria(estado.categoriaAtual.id); else fluxoMenu(); } },
          { rotulo: '💲 Comparar com pacote', acao: function () { fluxoCategoria('checkup'); } },
          { rotulo: '🏠 Voltar ao início', classe: 'menu-casa', acao: fluxoMenu }
        ]);
      });
    });
  }

  function fluxoDuvidas() {
    estado.etapa = 'duvida';
    var perguntas = CONFIG.duvidas.map(function (d) { return { rotulo: d.pergunta, acao: function () { respostaDuvida(d); } }; });
    perguntas.push({ rotulo: '🏠 Voltar aos exames', classe: 'menu-casa', acao: fluxoMenu });
    perguntas.push({ rotulo: '💬 Falar com a atendente', classe: 'atendente', acao: fluxoAtendente });
    fala('Tenho estas dúvidas prontas aqui. Toque na que for a sua 👇', 700).then(function () {
      botoes(perguntas);
    });
  }

  function respostaDuvida(d) {
    if (estado.duvidas.indexOf(d.pergunta) === -1) estado.duvidas.push(d.pergunta);
    fala(preencher(d.resposta), 950).then(function () {
      fala('Anotado por aqui. Tem mais alguma coisa?', 600).then(function () {
        botoes([
          { rotulo: '❓ Outra dúvida', acao: fluxoDuvidas },
          { rotulo: '🩸 Ver exames e valores', acao: fluxoMenu },
          { rotulo: '💬 Falar com a atendente', classe: 'atendente', acao: fluxoAtendente }
        ]);
      });
    });
  }

  function fluxoAtendente() {
    estado.etapa = 'atendente';
    campo.placeholder = 'Opcional: seu horário preferido';
    fala('Beleza, ' + (estado.nome || 'tudo bem') + '! Só um detalhe antes de te transferir:', 650)
      .then(function () {
        return fala(estado.escolha
          ? 'Você já escolheu “' + estado.escolha.nome + '”. Qual período fica melhor para a coleta?'
          : 'Qual período fica melhor para a coleta?', 700);
      })
      .then(function () {
        botoes([
          { rotulo: '🌅 Manhora (6h-12h)', acao: function () { fechamentoAtendente('manhã (6h às 12h)'); } },
          { rotulo: '🌇 Tarde (12h-18h)', acao: function () { fechamentoAtendente('tarde (12h às 18h)'); } },
          { rotulo: '🗓️ Sábado de manhã', acao: function () { fechamentoAtendente('sábado de manhã'); } },
          { rotulo: '🤔 Tanto faz', acao: function () { fechamentoAtendente('tanto faz'); } }
        ]);
      });
  }

  function fechamentoAtendente(periodo) {
    estado.periodo = periodo;
    fala('Perfeito, ' + (estado.nome || '') + '. ' + (estado.escolha ? 'Vou confirmar a disponibilidade de “' + estado.escolha.nome + '” para ' + periodo + '. ' : '') + 'Um instante…', 900)
      .then(function () { return escrever(1500); })
      .then(function () { return fala('Pronto! O fluxo automatizado terminou aqui. 👇 Agora é a sua vez: ao tocar no botão verde abaixo, você cai direto na conversa real com a ' + CONFIG.clinica.atendente + ' no WhatsApp, já com o seu resumo preenchido.', 900); })
      .then(function () { cartaoTransferencia(); campo.placeholder = 'Digite seu nome…'; });
  }

  /* ─────────────── ENTRADA LIVRE DO USUÁRIO ─────────────── */
  var sinonimos = [
    { chaves: ['atendente', 'humano', 'pessoa', 'falar com alguem', 'falar com alguém', 'whatsapp', 'marina'], acao: fluxoAtendente },
    { chaves: ['duvida', 'dúvida', 'preparo', 'jejum', 'convenio', 'convênio', 'resultado', 'horario', 'horário', 'endereco', 'endereço', 'pagamento'], acao: fluxoDuvidas },
    { chaves: ['sangue', 'laborator', 'hemograma', 'glicose', 'colesterol', 'exame de sangue'], acao: function () { fluxoCategoria('sangue'); } },
    { chaves: ['imagem', 'ultra', 'ultrass', 'mamografia', 'raio', 'ressonancia', 'ressonância', 'tomografia', 'ecocardi'], acao: function () { fluxoCategoria('imagem'); } },
    { chaves: ['check', 'pacote', 'combo', 'executivo'], acao: function () { fluxoCategoria('checkup'); } },
    { chaves: ['domicilio', 'domicílio', 'casa', 'coleta', 'urina', 'fezes', 'gravidez'], acao: function () { fluxoCategoria('coleta'); } },
    { chaves: ['menu', 'inicio', 'início', 'voltar', 'outra coisa'], acao: fluxoMenu },
    { chaves: ['oi', 'ola', 'olá', 'bom dia', 'boa tarde', 'boa noite'], acao: function () { fluxoMenu(); } }
  ];

  function procuraNaTabela(txt) {
    var min = txt.toLowerCase();
    for (var i = 0; i < CONFIG.categorias.length; i++) {
      var achado = CONFIG.categorias[i].itens.filter(function (it) {
        return it.nome.toLowerCase().indexOf(min) !== -1;
      })[0];
      if (achado) {
        estado.categoriaAtual = CONFIG.categorias[i];
        fluxoItem(achado);
        return true;
      }
    }
    return false;
  }

  function nomeValido(txt) {
    var limpo = txt.replace(/[^\p{L}\s]/gu, '').trim();
    return limpo.length >= 2 && limpo.length <= 40 && !/^\d+$/.test(txt.trim());
  }

  function trataMensagem(txt) {
    var limpo = txt.trim();
    if (!limpo) return;
    bolha('eu', limpo);
    setTimeout(marcaLidos, 900);

    if (estado.etapa === 'esperando_nome') {
      if (nomeValido(limpo)) {
        estado.nome = limpo.replace(/\s+/g, ' ').replace(/[^\p{L}\s'’-]/gu, '')
          .split(' ').map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ');
        estado.etapa = 'menu';
        campo.placeholder = 'Digite sua mensagem';
        fala('Oi, ' + estado.nome + '! Prazer da ' + CONFIG.clinica.nome + '. 😊', 700).then(fluxoMenu);
      } else {
        fala('Desculpa, não entendi como nome. Pode digitar só o seu primeiro nome mesmo? 🙏', 700);
      }
      return;
    }

    if (estado.etapa === 'atendente' && limpo.length > 1) {
      estado.periodo = limpo;
      fechamentoAtendente(limpo);
      return;
    }

    var min = limpo.toLowerCase();
    if (limpo.replace(/\s/g, '').length >= 4 && procuraNaTabela(limpo)) return;
    for (var i = 0; i < sinonimos.length; i++) {
      if (sinonimos[i].chaves.some(function (k) { return min.indexOf(k) !== -1; })) {
        sinonimos[i].acao();
        return;
      }
    }

    fala('Ainda não sei responder isso (' + limpo + '). Posso te mostrar os exames com valores, as dúvidas frequentes, ou te passar direto para a ' + CONFIG.clinica.atendente + '. 😊', 800)
      .then(function () {
        botoes([
          { rotulo: '🩸 Ver exames e valores', acao: fluxoMenu },
          { rotulo: '❓ Dúvidas frequentes', acao: fluxoDuvidas },
          { rotulo: '💬 Falar com a atendente', classe: 'atendente', acao: fluxoAtendente }
        ]);
      });
  }

  function marcaLidos() {
    var selos = conversa.querySelectorAll('.eu .selo');
    if (selos.length) selos[selos.length - 1].classList.add('lido');
  }

  /* ─────────────── EVENTOS ─────────────── */
  function abre() {
    painel.classList.add('aberto');
    abrir.style.display = 'none';
    dica.style.display = 'none';
    novo.style.display = 'none';
    if (!conversa.childNodes.length) fluxoBoasVindas();
    setTimeout(function () { campo.focus(); }, 250);
  }
  function fecha() {
    painel.classList.remove('aberto');
    abrir.style.display = 'flex';
    novo.style.display = 'flex';
  }
  /* ─────────── MODO PÁGINA ───────────
     Com data-modo="pagina" no <body> esta página É o atendimento: o chat abre
     sozinho, não aparece balão nem aviso, e o botão do cabeçalho volta para o
     site. Sem esse atributo o mesmo script funciona como widget flutuante. */
  var modoPagina = document.body.getAttribute('data-modo') === 'pagina';
  var PAGINA_SITE = 'index.html';
  var svgVoltar = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>';

  abrir.onclick = abre;
  fechar.onclick = function () {
    if (modoPagina) { location.href = PAGINA_SITE; return; }
    fecha();
  };
  dica.onclick = abre;
  reiniciar.onclick = function () {
    estado.nome = null; estado.escolha = null; estado.duvidas = [];
    estado.periodo = null; estado.categoriaAtual = null; estado.etapa = 'esperando_nome';
    campo.placeholder = 'Digite seu nome…';
    fluxoBoasVindas();
  };
  enviar.onclick = function () {
    var v = campo.value; campo.value = '';
    if (v.trim()) trataMensagem(v);
  };
  campo.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var v = campo.value; campo.value = ''; if (v.trim()) trataMensagem(v); }
  });
  /* Expõe a configuração e a função de abrir para quem usar o script dentro do próprio site. */
  window.__cvdConfig = CONFIG;
  window.__cvdAbrirAtendimento = abre;

  if (modoPagina) {
    /* Página do atendimento: abre direto, esconde o balão e troca o "X" por voltar. */
    fechar.title = 'Voltar para o site';
    fechar.innerHTML = svgVoltar;
    abrir.style.display = 'none';
    dica.style.display = 'none';
    setTimeout(abre, 120);
  } else {
    setTimeout(function () { if (!painel.classList.contains('aberto')) dica.style.display = 'block'; }, 2200);
    setTimeout(function () { dica.style.display = 'none'; }, 12000);

    /* Widget copiado para dentro de outra página: se a URL tiver ?so=widget ou
       #widget, esconde o resto da página e abre o chat direto (o hash sobrevive
       melhor em file:// e em servidores estáticos). */
    if ((location.search + ' ' + location.hash).toLowerCase().indexOf('widget') !== -1) {
      Array.prototype.forEach.call(document.body.children, function (el) {
        if (el !== raiz && el.tagName !== 'SCRIPT') el.style.display = 'none';
      });
      document.body.style.background = 'transparent';
      setTimeout(abre, 120);
    }
  }
})();
</script>
<!-- FIM DO WIDGET -->

</body>
</html>
